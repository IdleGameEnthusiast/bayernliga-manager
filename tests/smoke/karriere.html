<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Eine neue Karriere, vom Startbildschirm bis zum zweiten Spieltag</title>
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="melder.css">
<script src="./melder.js"></script>
</head>
<body><div id="app" class="app"></div><div id="bericht"></div>

<!-- Erst leeren, dann erst die App laden — und beides statisch. Ein
     `await import()` im Modul geht am load-Ereignis vorbei, und dann steht der
     Browser noch mitten in der Arbeit, während der Runner schon abräumt. -->
<script type="module">
localStorage.clear();
</script>

<script type="module">
import '../../app.js';

const knopf = () => txt('.tageskarte button.haupt');
const tageskarte = () => txt('.tageskarte');
const leseKnoepfe = () => alle('.postlese button').map((b) => b.textContent);
const leseKnopf = (name) => alle('.postlese button').find((b) => b.textContent === name);
const zeileMit = (text) => alle('.postzeile').find((z) => z.textContent.includes(text));

/**
 * Durch die Rollen-Kampagne hindurch bis zu einem Datum.
 *
 * Seit der Kampagne ist die Offseason nicht mehr leer: an jedem Wochenanfang
 * fragt jemand nach seiner Rolle, und jede Anfrage hält den Kalender an. Wer
 * nur durch den Kalender will, tippt auf „Später" — genau das tut dieser
 * Helfer, Woche für Woche.
 */
function weiterBis(datum) {
  for (let i = 0; i < 90 && txt('.kopf-datum') !== datum; i++) {
    const k = q('.tageskarte button.haupt');
    if (!k) break;
    if (k.textContent.trim() !== 'Zur Nachricht ›') { k.click(); continue; }
    k.click();
    const spaeter = leseKnopf('Später');
    if (!spaeter) break;
    spaeter.click();
  }
}

try {
  // 1 — Der Startbildschirm
  gleich('Startbildschirm listet zwölf Vereine', alle('.start-team').length, 12);
  q('.start-team').click();
  q('.fuss button.haupt').click();

  // 2 — Die erste Ansicht ist der Posteingang.
  //
  // Eine neue Karriere steht in Saison 2026, und die beginnt am dritten
  // Oktobersamstag 2025. Die Beispielsaison in docs/umbau-kalender.md §4 ist
  // die 2027er — wer ihre Daten hier erwartet, misst das falsche Jahr.
  gleich('erster Reiter ist der Posteingang',
    q('.reiter button[aria-selected=true]').textContent, 'Posteingang');
  gleich('sechs Reiter', alle('.reiter button').length, 6);
  gleich('keine Fußleiste', alle('.fuss').length, 0);
  gleich('Raster steht auf Oktober 2025', txt('.kalkopf h2'), 'Oktober 2025');
  gleich('heute ist der 18.', txt('.kaltag.heute .kalzahl'), '18');
  const raster = [...q('.kalraster:not(.kalkopfzeile)').children];
  gleich('und steht in der Samstagsspalte',
    ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'][raster.indexOf(q('.kaltag.heute')) % 7], 'Sa');
  gleich('Kopfzeile trägt ein Datum statt eines Spieltags', txt('.kopf-datum'), 'Sa 18. Okt 2025');

  // 3 — Der Vorstand meldet sich und der Trainerstab dazu, aufhalten tut
  // keiner von beiden. Die Erinnerung eröffnet die Rollen-Kampagne; die
  // einzelnen Anfragen kommen erst ab der nächsten Woche.
  gleich('zwei Nachrichten liegen im Eingang', alle('.postzeile').length, 2);
  gleich('und beide sind ungelesen', alle('.postzeile.neu').length, 2);
  // Der Punkt oben am Reiter ist der einzige Hinweis, den man von den anderen
  // Ansichten aus sieht. Er zählt nicht sichtbar mit — die Zahl steht am
  // Ordnerknopf —, aber sein Titel tut es, und daran ist er zu prüfen.
  const punkte = () => alle('.reiter .reiterpunkt').length;
  gleich('der Reiter oben trägt einen Punkt', punkte(), 1);
  gleich('und zwar der Posteingang',
    q('.reiterpunkt').closest('button').textContent, 'Posteingang');
  gleich('er weiß, wie viel da liegt', q('.reiterpunkt').title, '2 ungelesen');
  pruefe('der Trainerstab eröffnet die Rollen-Kampagne', !!zeileMit('woran sie ist'),
    alle('.postbetreff').map((e) => e.textContent).join(' | '));
  gleich('sie verlangt keine Antwort', alle('.postzeichen.antwort').length, 0);
  gleich('der Weg zum ersten Spieltag ist frei', knopf(), 'Bis dahin');
  enthaelt('nächster Termin', tageskarte(), 'Nächster Termin');
  // Der nächste Zwangsstopp ist nicht der erste Spieltag, sondern der Beginn
  // der Preseason vier Wochen davor — die Offseason endet mit einem Halt.
  enthaelt('am 21. März', tageskarte(), 'Sa 21. Mär');
  enthaelt('zur Preseason', tageskarte(), 'Preseason');

  // Lesen heißt lesen: die Nachricht schlägt rechts auf und bleibt links stehen.
  enthaelt('rechts steht noch nichts', txt('.postlese'), 'Wähle eine Nachricht');
  zeileMit('Willkommen bei').click();
  enthaelt('die Nachricht schlägt rechts auf', txt('.postlese'), 'Willkommen bei');
  gleich('sie ist jetzt gelesen', alle('.postzeile.neu').length, 1);
  gleich('der Punkt oben zählt mit', q('.reiterpunkt').title, '1 ungelesen');
  gleich('und liegt weiter im Posteingang', alle('.postzeile').length, 2);
  pruefe('unten steht das Löschen', leseKnoepfe().includes('Löschen'), leseKnoepfe().join(' | '));
  gleich('und sonst nichts', leseKnoepfe().length, 1);

  // 4 — Der Ordner „Gelöscht" und der Weg zurück
  gleich('zwei Ordner', alle('.postordner-knopf').length, 2);
  leseKnopf('Löschen').click();
  gleich('die gelöschte ist aus dem Eingang weg', alle('.postzeile').length, 1);
  pruefe('die andere bleibt stehen', !!zeileMit('woran sie ist'));
  alle('.postordner-knopf')[1].click();
  gleich('im Gelöscht liegt sie', alle('.postzeile').length, 1);
  q('.postzeile').click();
  leseKnopf('Wiederherstellen').click();
  gleich('der Posteingang steht wieder offen',
    txt('.postordner-knopf.aktiv .postordner-name'), 'Posteingang');
  gleich('und beide Nachrichten darin', alle('.postzeile').length, 2);
  zeileMit('woran sie ist').click();
  gleich('nichts Ungelesenes mehr, kein Punkt', punkte(), 0);

  // 5 — Ein Tipp im Raster wählt nur aus; simuliert wird auf Knopfdruck
  gleich('noch steht keine Auswahl da', alle('.kalauswahl').length, 0);
  const imOktober = alle('.kaltag.waehlbar');
  const letzterOkt = imOktober[imOktober.length - 1];
  enthaelt('ein späterer Tag lädt zum Auswählen',
    letzterOkt.getAttribute('title'), 'auswählen');
  gleich('der 31. ist der letzte des Monats',
    letzterOkt.querySelector('.kalzahl').textContent, '31');
  letzterOkt.click();
  gleich('der Tipp allein bewegt die Uhr nicht', txt('.kopf-datum'), 'Sa 18. Okt 2025');
  enthaelt('er wählt den Tag', txt('.kalauswahl-datum'), 'Fr 31. Okt');
  gleich('und bietet den Knopf an',
    txt('.kalauswahl button.haupt'), 'Bis zu diesem Datum simulieren');
  q('.kalauswahl button.haupt').click();
  // Nicht bis zum 31.: am Wochenanfang davor steht die erste Rollen-Anfrage im
  // Postfach, und eine offene Antwort geht jedem Ziel vor.
  gleich('erst der Knopf bewegt sie', txt('.kopf-datum'), 'Sa 25. Okt 2025');
  gleich('die Auswahl ist danach weg', alle('.kalauswahl').length, 0);
  gleich('und die Tageskarte führt zur offenen Antwort', knopf(), 'Zur Nachricht ›');

  // 5b — Die Rollen-Kampagne: die Anfrage, das Gespräch, die Rolle
  q('.tageskarte button.haupt').click();
  enthaelt('ein Spieler fragt nach seiner Rolle', txt('.postlese h3'), 'fragt nach seiner Rolle');
  pruefe('und lässt sich vertagen oder besprechen',
    leseKnoepfe().includes('Später') && leseKnoepfe().includes('Mit ihm reden'),
    leseKnoepfe().join(' | '));

  leseKnopf('Mit ihm reden').click();
  gleich('das Gespräch schlägt auf', alle('.frageschirm .gespraech').length, 1);
  enthaelt('es sagt, dass ihm noch niemand etwas gesagt hat',
    txt('.gespraech'), 'Bisher hat ihm niemand gesagt');
  gleich('fünf Rollen stehen zur Wahl', alle('.gespraech-kategorie').length, 5);
  const rollenKnopf = (name) =>
    alle('.gespraech-kategorie').find((b) => b.textContent.startsWith(name));
  pruefe('darunter der Ergänzungsspieler', !!rollenKnopf('Ergänzungsspieler'),
    alle('.gespraech-kategorie').map((b) => b.textContent).join(' | '));

  rollenKnopf('Starter').click();
  gleich('danach steht nur noch seine Reaktion da', alle('.gespraech-reaktion').length, 1);
  enthaelt('und die gesetzte Rolle', txt('.gespraech'), 'Bisher: Starter');
  q('.fragenknoepfe button').click();
  gleich('das Blatt ist zu', alle('.frageschirm').length, 0);
  // Diese eine Anfrage ist beantwortet — die zweite dieser Woche steht noch:
  // das Tempo schickt so viele, dass die Liste bis zur Frist leer wird, und
  // das sind bei dreißig Mann zwei pro Woche.
  gleich('eine Anfrage bleibt für diese Woche offen',
    alle('.postzeile .postzeichen.antwort').length, 1);

  // Und die Rolle steht in der Personalakte, wo sie hingehört.
  alle('.reiter button').find((b) => b.textContent === 'Personal').click();
  const kopfzellen = alle('.tabelle-scroll th').map((h) => h.textContent);
  pruefe('die Personalakte trägt eine Rollenspalte',
    kopfzellen.some((k) => k.startsWith('Rolle')), kopfzellen.join(' | '));
  pruefe('und genau ein Mann hat eine',
    alle('.spielerzeile td').filter((z) => z.textContent === 'Starter').length === 1,
    alle('.spielerzeile td').filter((z) => z.textContent === 'Starter').length);
  pruefe('jede Zeile bietet das Gespräch an',
    alle('.spielerzeile button').length === alle('.spielerzeile').length);

  // 5c — Über persönliche Themen sprechen: der zweite Weg ins Gespräch, und
  // die einzige Kategorie, die nichts verlangt außer dem Termin.
  q('.spielerzeile button').click();
  const katKnopf = (name) =>
    alle('.gespraech-kategorie').find((b) => b.textContent.startsWith(name));
  gleich('fünf Kategorien stehen da', alle('.gespraech-kategorie').length, 5);
  pruefe('die ungebauten sind gesperrt', katKnopf('Überzeugen').disabled,
    alle('.gespraech-kategorie').filter((b) => b.disabled).length);

  katKnopf('Über persönliche Themen').click();
  enthaelt('erst wird gefragt, bevor der Termin draufgeht',
    txt('.gespraech'), 'Einfach mal reden');
  const redeKnopf = alle('.fragenknoepfe button').find((b) => b.textContent === 'Reden');
  pruefe('und es gibt einen Knopf dafür', !!redeKnopf,
    alle('.fragenknoepfe button').map((b) => b.textContent).join(' | '));

  redeKnopf.click();
  gleich('danach steht seine Reaktion da', alle('.gespraech-reaktion').length, 1);
  pruefe('ohne ein Wort über die Rolle — darum ging es nicht',
    !txt('.gespraech').includes('Bisher:'), txt('.gespraech'));
  q('.fragenknoepfe button').click();
  gleich('das Blatt ist zu', alle('.frageschirm').length, 0);

  // 5d — Wunsch anhören: die Kategorie, die nur informiert. Was sie zutage
  // fördert, hängt am Kader und ist hier nicht festzunageln; festnageln lässt
  // sich, dass sie fragt, bevor sie einen Termin verbraucht, und dass danach
  // eine Antwort dasteht.
  q('.spielerzeile button').click();
  katKnopf('Wunsch anhören').click();
  enthaelt('auch hier wird erst gefragt', txt('.gespraech'), 'Hast du etwas auf dem Herzen');
  enthaelt('und gesagt, dass es einen Termin kostet', txt('.gespraech'), 'Kostet einen Termin');
  const fragKnopf = alle('.fragenknoepfe button').find((b) => b.textContent === 'Nachfragen');
  pruefe('mit einem Knopf dafür', !!fragKnopf,
    alle('.fragenknoepfe button').map((b) => b.textContent).join(' | '));

  fragKnopf.click();
  gleich('danach steht seine Antwort da', alle('.gespraech-reaktion').length, 1);
  q('.fragenknoepfe button').click();
  gleich('das Blatt ist wieder zu', alle('.frageschirm').length, 0);

  // Der dritte Termin ist damit weg: das Kontingent gilt über alle Kategorien.
  q('.spielerzeile button').click();
  enthaelt('die Woche ist aufgebraucht', txt('.gespraech'), 'kein Gespräch mehr drin');
  pruefe('und keine Kategorie ist mehr anzutippen',
    alle('.gespraech-kategorie').every((b) => b.disabled),
    alle('.gespraech-kategorie').filter((b) => !b.disabled).length);
  q('.fragenknoepfe button').click();

  alle('.reiter button').find((b) => b.textContent === 'Posteingang').click();

  // Die zweite Anfrage lässt sich vertagen: sie ist damit beantwortet, aber er
  // hat weiter keine Rolle und steht nächste Woche wieder da.
  leseKnopf('Später') || zeileMit('fragt nach').click();
  leseKnopf('Später').click();
  gleich('danach läuft die Uhr wieder', knopf(), 'Bis dahin');
  gleich('und steht noch auf demselben Tag', txt('.kopf-datum'), 'Sa 25. Okt 2025');

  // 6 — Ein Ziel hinter dem Spieltag: die Uhr hält trotzdem am eigenen Spiel
  for (let i = 0; i < 6; i++) q('.kalkopf .kalpfeil:last-of-type').click();
  gleich('das Raster lässt sich blättern', txt('.kalkopf h2'), 'April 2026');
  const imApril = alle('.kaltag.waehlbar');
  const letzterApr = imApril[imApril.length - 1];
  gleich('bis zum 30. April', letzterApr.querySelector('.kalzahl').textContent, '30');
  letzterApr.click();
  q('.kalauswahl button.haupt').click();
  weiterBis('Sa 21. Mär 2026');
  gleich('die Uhr hält am Beginn der Preseason, nicht am Ziel',
    txt('.kopf-datum'), 'Sa 21. Mär 2026');
  weiterBis('Sa 18. Apr 2026');
  gleich('und danach am eigenen Spiel, immer noch nicht am Ziel',
    txt('.kopf-datum'), 'Sa 18. Apr 2026');
  gleich('Raster ist zum heutigen Tag zurückgekehrt', txt('.kalkopf h2'), 'April 2026');
  gleich('heute ist der 18. April', txt('.kaltag.heute .kalzahl'), '18');
  gleich('Tageskarte trägt den Kickoff', knopf(), 'Kickoff');
  enthaelt('und nennt den Gegner', tageskarte(), 'gegen ');

  // 7 — Kickoff: der Spielbericht schlägt sich auf
  q('.tageskarte button.haupt').click();
  gleich('der Spielbericht öffnet sich', alle('.bericht-kopf').length, 2);
  gleich('ohne Reiter', alle('.reiter').length, 0);
  q('.fuss button.haupt').click();

  // 8 — Zurück im Postfach liegen Spielbericht und Rundenergebnisse
  const betreffe = alle('.postbetreff').map((e) => e.textContent);
  pruefe('der Spielbericht liegt im Postfach',
    betreffe.some((b) => /\d+:\d+/.test(b)), betreffe.join(' | '));
  pruefe('die Rundenergebnisse auch',
    betreffe.some((b) => /^Spieltag 1 /.test(b)), betreffe.join(' | '));
  gleich('die Uhr steht am zweiten Spieltag', txt('.kopf-datum'), 'Sa 25. Apr 2026');
  gleich('und bietet den nächsten Kickoff', knopf(), 'Kickoff');

  // Auswählen zeichnet die Ansicht neu — die Zeile von vorhin ist danach eine
  // abgehängte, und es muss frisch gesucht werden.
  const berichtZeile = alle('.postzeile').find((z) => /\d+:\d+/.test(z.textContent));
  pruefe('der Spielbericht liegt als Nachricht vor', !!berichtZeile);
  berichtZeile.click();
  const zumBericht = leseKnopf('Spielbericht ansehen');
  pruefe('und führt von dort zum Box Score', !!zumBericht, leseKnoepfe().join(' | '));
  zumBericht.click();
  gleich('der Box Score steht wieder da', alle('.bericht-kopf').length, 2);
  q('.fuss button.haupt').click();

  // 9 — Der Roster: drei Bereiche, und beide Richtungen des Aufstellens
  const reiterKnopf = (name) => alle('.reiter button').find((b) => b.textContent === name);
  reiterKnopf('Roster').click();
  const kartenTitel = alle('.karte h2').map((h) => h.textContent);
  gleich('drei Bereiche und ein Kopf', kartenTitel.length, 4);
  pruefe('Offense, Defense und Special Teams',
    ['Offense', 'Defense', 'Special Teams'].every((t) => kartenTitel.includes(t)),
    kartenTitel.join(' | '));
  gleich('jeder Bereich zeigt seine Stärke', alle('.staerkezahl').length, 3);
  gleich('elf Plätze in der Offense', alle('.karte')[1].querySelectorAll('.aufstellung li').length, 11);
  gleich('elf in der Defense', alle('.karte')[2].querySelectorAll('.aufstellung li').length, 11);

  // Die Special Teams: drei Plätze, gebaut wie die zweiundzwanzig — ohne
  // eigene Marke „automatisch", ohne eigenen Knopf, ohne Einzelwerte.
  const special = () => alle('.karte')[3];
  gleich('drei Special-Teams-Plätze', special().querySelectorAll('.aufstellung li').length, 3);
  gleich('alle drei besetzt', special().querySelectorAll('.aufstellung .platz-stk').length, 3);
  gleich('keine Marke, die die Elf nicht kennt', special().querySelectorAll('.marke.auto').length, 0);
  gleich('die Werte stehen nicht an den Plätzen',
    special().querySelectorAll('.aufstellung .specialwerte').length, 0);

  // Platz zuerst: ein Tipp auf QB, dann der Erste aus der Liste links.
  const qbZeile = () => alle('.karte')[1].querySelector('.aufstellung li');
  const qbName = () => qbZeile().querySelector('.platz-name').textContent;
  const vorher = qbName();
  qbZeile().click();
  enthaelt('der Kopf sagt, für wen die Liste gilt',
    alle('.karte')[1].querySelector('.verfuegbarkopf h3').textContent, 'QB');
  const ersterFrei = alle('.karte')[1].querySelector('.verfuegbare li');
  const neuerName = ersterFrei.querySelector('.verfuegbar-name').textContent;
  ersterFrei.click();
  gleich('der zweite Tipp setzt ihn ein', qbName(), neuerName);
  pruefe('und er stand vorher nicht dort', vorher !== neuerName, vorher);
  gleich('es steht sofort im Stand und braucht keine Leiste',
    alle('.wechselleiste').length, 0);

  // Ein Platz, den es zweimal gibt. In 11 personnel heißt der zweite Receiver
  // `WR#2` — ein Schlüssel, kein Platzname. Wer ihn zum Bewerten weiterreichte,
  // ließ `wertAuf()` mit „Unbekannter Platz" werfen, und die ganze Ansicht
  // unterhalb der Reiter blieb weg. Genau deshalb steht diese Prüfung hier.
  // Jeder Klick zeichnet neu — ein festgehaltenes Element ist danach abgehängt
  // und sein Handler kennt den alten Zustand. Deshalb jedes Mal frisch suchen.
  //
  // Welches System der Verein spielt, lost die Karriere aus — ohne Seed, also
  // jedes Mal anders. Deshalb wird nicht der fünfte Platz genommen, sondern
  // der erste, dessen Kürzel schon einmal vorkam: in Double Wing ist das der
  // zweite Fullback, sonst ein Receiver oder Tight End. Mit dem festen Index
  // fiel die Seite in jedem achten Lauf, und niemand sah, warum.
  const doppelter = () => {
    const gesehen = new Set();
    for (const li of alle('.karte')[1].querySelectorAll('.aufstellung li')) {
      const kuerzel = li.querySelector('.platz').textContent;
      if (gesehen.has(kuerzel)) return li;
      gesehen.add(kuerzel);
    }
    throw new Error('kein doppelter Platz in der Offense');
  };
  const doppelKuerzel = doppelter().querySelector('.platz').textContent;
  pruefe('ein Platz der Offense kommt zweimal vor', /^(WR|TE|FB|SL)$/.test(doppelKuerzel), doppelKuerzel);
  doppelter().click();
  gleich('ein doppelt vergebener Platz lässt die Ansicht stehen',
    alle('.karte').length, 4);
  enthaelt('und die Liste links gilt für ihn',
    alle('.karte')[1].querySelector('.verfuegbarkopf h3').textContent, doppelKuerzel);
  doppelter().click();
  enthaelt('der zweite Tipp nimmt die Wahl zurück',
    alle('.karte')[1].querySelector('.verfuegbarkopf h3').textContent, 'Verfügbar');

  // Mann zuerst: ein Tipp links, und jeder Platz trägt seine Zahl.
  alle('.karte')[2].querySelector('.verfuegbare li').click();
  pruefe('jeder Platz zeigt jetzt zwei Zahlen',
    alle('.karte')[2].querySelectorAll('.aufstellung li .platz-stk.neu').length > 0);
  alle('.karte')[2].querySelector('.verfuegbare li').click();

  // Der Papierkorb räumt genau einen Platz — und lässt ihn leer.
  gleich('jeder besetzte Platz trägt einen Papierkorb',
    alle('.karte')[1].querySelectorAll('.aufstellung li .papierkorb').length, 11);
  alle('.karte')[1].querySelector('.aufstellung li .papierkorb').click();
  gleich('der geräumte Platz steht leer', qbName(), '—');
  enthaelt('und die Elf hat keine Stärke mehr', txt('.rosterkopf'), 'Gesamt: –');
  gleich('aber keine Warnung — die stellt der Kickoff-Knopf',
    alle('.rosterkopf .warnung').length, 0);
  gleich('sein Bereich zeigt statt der Zahl einen Strich',
    alle('.staerkezahl')[0].querySelector('strong').textContent, '–');

  // 9b — Mit dem Loch zum Kickoff: der Knopf fragt, bevor er wertet. „Zur
  // Aufstellung" führt zurück in den Roster, das Spiel bleibt ungespielt.
  reiterKnopf('Posteingang').click();
  gleich('die Tageskarte bietet den Kickoff trotzdem an', knopf(), 'Kickoff');
  q('.tageskarte button.haupt').click();
  gleich('der Knopf fragt statt zu werten', alle('.frageschirm').length, 1);
  enthaelt('und sagt, was es kostet', txt('.frage'), '0:36');
  const frageKnopf = (name) => alle('.fragenknoepfe button').find((b) => b.textContent === name);
  pruefe('mit den zwei Antworten', !!frageKnopf('Spiel absagen, Wertung 0:36')
    && !!frageKnopf('Zur Aufstellung'));
  frageKnopf('Zur Aufstellung').click();
  gleich('„Zur Aufstellung" schlägt den Roster auf', alle('.karte h2')[0].textContent, 'Roster');
  gleich('und die Frage ist weg', alle('.frageschirm').length, 0);
  gleich('die Uhr steht noch am Spieltag', txt('.kopf-datum'), 'Sa 25. Apr 2026');

  // Ein Kicker von Hand.
  const specialZeile = (i = 0) => special().querySelectorAll('.aufstellung li')[i];
  const specialWerte = () => special().querySelector('.verfuegbare .specialwerte').textContent;
  gleich('ohne Auswahl stehen links keine Kickwerte',
    special().querySelectorAll('.verfuegbare .specialwerte').length, 0);
  specialZeile().click();
  enthaelt('erst die Auswahl zeigt die Kickstärke', specialWerte(), 'Kickstärke');
  enthaelt('und die Kickgenauigkeit', specialWerte(), 'Kickgenauigkeit');
  enthaelt('die Special-Liste gilt für den Kicker',
    special().querySelector('.verfuegbarkopf h3').textContent, 'K');
  // Die Offense-Liste sortiert ein Kicker-Platz nicht — und ihre Überschrift
  // darf das dann auch nicht behaupten.
  enthaelt('die Offense-Liste behauptet nichts',
    alle('.karte')[1].querySelector('.verfuegbarkopf h3').textContent, 'Verfügbar');
  // Der Long Snapper trägt nur seine Zahl: seine Kickwerte entscheiden nichts,
  // und seine eigenen zwei stünden bei jedem Kandidaten auf null.
  specialZeile(2).click();
  gleich('beim Long Snapper steht links kein Einzelwert',
    special().querySelectorAll('.verfuegbare .specialwerte').length, 0);
  enthaelt('aber die Liste gilt für ihn',
    special().querySelector('.verfuegbarkopf h3').textContent, 'LS');
  specialZeile().click();
  gleich('die Zeile nennt die Position dessen, der dort steht',
    specialZeile().querySelectorAll('.platz-pos').length, 1);
  special().querySelector('.verfuegbare li').click();
  gleich('der Kicker trägt links seine Marke',
    special().querySelectorAll('.verfuegbare .marke.tausch[title="Kicker"]').length, 1);
  gleich('der Kicker ist jetzt von Hand gesetzt, und die Zeile sieht aus wie vorher',
    special().querySelectorAll('.aufstellung .platz-stk').length, 3);
  gleich('kein Knopf zurück in eine Automatik', alle('.schalter.loesen').length, 0);

  // Der Papierkorb gilt auch hier: kein Kicker ist eine erlaubte Aufstellung.
  gleich('jeder der drei trägt einen Papierkorb',
    special().querySelectorAll('.aufstellung .papierkorb').length, 3);
  special().querySelector('.aufstellung .papierkorb').click();
  gleich('der geräumte Platz steht leer',
    specialZeile().querySelector('.platz-name').textContent, '—');
  gleich('geräumt hat er nichts mehr zu räumen',
    special().querySelectorAll('.aufstellung .papierkorb').length, 2);

  // „Automatisch aufstellen" ist der Weg zurück aus einer Elf mit Loch — und
  // derselbe Weg für den geräumten Kicker-Platz.
  const knopfMit = (name) => alle('.aufstellungsknoepfe button')
    .find((b) => b.textContent === name);
  gleich('gespeichert wird nicht mehr von Hand', !!knopfMit('Speichern'), false);
  gleich('und verworfen auch nicht', !!knopfMit('Verwerfen'), false);
  knopfMit('Automatisch aufstellen').click();
  enthaelt('die Automatik füllt den geräumten Platz wieder', txt('.rosterkopf'), 'Gesamt: ');
  gleich('und den Kicker-Platz gleich mit',
    special().querySelectorAll('.aufstellung .papierkorb').length, 3);

  // 9c — Die andere Antwort: „Spiel absagen" wertet, ohne zu spielen. Der
  // Bericht sagt es, und die Uhr steht danach am nächsten Spieltag.
  alle('.karte')[1].querySelector('.aufstellung li .papierkorb').click();
  gleich('die Elf hat wieder ein Loch', qbName(), '—');
  reiterKnopf('Posteingang').click();
  q('.tageskarte button.haupt').click();
  gleich('der Kickoff fragt wieder', alle('.frageschirm').length, 1);
  frageKnopf('Spiel absagen, Wertung 0:36').click();
  gleich('der Spielbericht öffnet sich', alle('.bericht-kopf').length, 2);
  enthaelt('und sagt, dass nicht gespielt wurde', txt('.warnung'), 'nicht angetreten');
  enthaelt('mit der Wertung', txt('.warnung'), '36');
  q('.fuss button.haupt').click();
  gleich('die Uhr steht am dritten Spieltag', txt('.kopf-datum'), 'Sa 2. Mai 2026');
  reiterKnopf('Roster').click();
  knopfMit('Automatisch aufstellen').click();
  enthaelt('und die Elf ist wieder vollzählig', txt('.rosterkopf'), 'Gesamt: ');

  // 10 — Personal: die Tabelle ist umgezogen, die Coaches stehen daneben, Orga still
  reiterKnopf('Personal').click();
  gleich('drei Unterreiter', alle('.reiter.unter button').length, 3);
  gleich('einer davon gesperrt', alle('.reiter.unter button[disabled]').length, 1);
  pruefe('die Spielertabelle steht hier', alle('tr.spielerzeile').length > 20);
  gleich('und im Roster nicht mehr', alle('.karte h2')[0].textContent, 'Spieler');
  q('tr.spielerzeile').click();
  gleich('eine Zeile klappt die Werte auf', alle('tr.wertezeile').length, 1);
  enthaelt('samt der Kickwerte', txt('tr.wertezeile'), 'Kickstärke');

  // 10b — Das Commitment: eine Spalte mit Stufe, der Satz unter den Werten, und
  // die Zahl bleibt versteckt, solange niemand den Code eingelöst hat.
  const stufen = ['niedrig', 'schwankend', 'moderat', 'hoch', 'sehr hoch'];
  const koepfe = alle('thead th').map((h) => h.textContent);
  pruefe('die Tabelle hat eine Spalte Commitment', koepfe.some((k) => k.startsWith('Commitment')), koepfe.join(' | '));
  const bindungZellen = alle('tr.spielerzeile td').filter((td) => stufen.includes(td.textContent));
  pruefe('jede Zeile trägt eine Stufe', bindungZellen.length > 20, String(bindungZellen.length));
  gleich('und keine Zahl daneben', alle('tr.spielerzeile .versteckt').length, 0);
  enthaelt('unter den Werten steht die Lebenslage', txt('tr.wertezeile'), 'Lebenslage');
  enthaelt('mit dem Verein darin', txt('tr.wertezeile'), 'im Verein');
  gleich('die versteckten Zahlen stehen nicht da', alle('tr.wertezeile .versteckt').length, 0);

  // 11 — Coaches: zwei Koordinatoren, aufklappbar auf ihre vier Blöcke
  alle('.reiter.unter button').find((b) => b.textContent === 'Coaches').click();
  gleich('der Stab hat zwei Zeilen', alle('tr.coachzeile').length, 2);
  enthaelt('ein Offense Coordinator', txt('tr.coachzeile'), 'Offense Coordinator');
  q('tr.coachzeile').click();
  gleich('eine Zeile klappt die Blöcke auf', alle('tr.wertezeile').length, 1);
  gleich('und es sind vier', alle('.werteblock').length, 4);
  enthaelt('mit der Vertrautheit', txt('tr.wertezeile'), 'Vertrautheit mit Personnel');
  enthaelt('und der Lebenslage des Coaches', txt('tr.wertezeile'), 'Lebenslage');
  gleich('auch der Stab trägt eine Spalte Commitment',
    alle('thead th').filter((h) => h.textContent === 'Commitment').length, 1);

  // 12 — Redeem Code: ein falscher Code sagt es, `playtester` zeigt die Zahlen
  reiterKnopf('Posteingang').click();
  gleich('das Feld steht ganz unten', alle('.codezeile input').length, 1);
  const codeFeld = () => q('.codezeile input');
  const codeKnopf = () => q('.codezeile button');
  codeFeld().value = 'sesam';
  codeKnopf().click();
  enthaelt('ein unbekannter Code wird abgelehnt', txt('.codezeile'), 'kennt das Spiel nicht');
  gleich('und nichts ist freigeschaltet', alle('.codezeile .versteckt').length, 0);
  codeFeld().value = 'Playtester';
  codeKnopf().click();
  enthaelt('der richtige Code schaltet den Modus ein', txt('.codezeile'), 'Playtester-Modus aktiv');
  gleich('das Feld ist dann weg', alle('.codezeile input').length, 0);
  reiterKnopf('Personal').click();
  alle('.reiter.unter button').find((b) => b.textContent === 'Spieler').click();
  pruefe('jetzt steht die Zahl neben der Stufe', alle('tr.spielerzeile .versteckt').length > 20);
  // Die erste Zeile steht seit Abschnitt 10 offen — die Ansicht merkt sich
  // das über den Reiterwechsel hinweg. Ein Tipp schlösse sie wieder.
  if (alle('tr.wertezeile').length === 0) q('tr.spielerzeile').click();
  enthaelt('und unter den Werten die versteckten', txt('tr.wertezeile .versteckt'), 'Commitment');
  enthaelt('samt der Waage aus dem Lebenslauf', txt('tr.wertezeile .versteckt'), 'Druck');
  // Das Talent steht **nicht** mehr dabei: seit es in halben Sternen am Mann
  // steht, zeigt die Spalte es vollständig, und es gibt nichts zu enthüllen.
  pruefe('und nicht mehr das Talent', !txt('tr.wertezeile .versteckt').includes('Talent'));
  reiterKnopf('Posteingang').click();
  q('.codezeile button').click();
  gleich('der Modus lässt sich beenden', alle('.codezeile input').length, 1);
  reiterKnopf('Personal').click();
  gleich('und die Zahlen sind wieder weg', alle('tr.spielerzeile .versteckt').length, 0);
} catch (e) { merkeFehler(e); }
melde();
</script></body></html>
