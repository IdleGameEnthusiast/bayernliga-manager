<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Tryout: eigener Bildschirm, fünf Gespräche, Zusagen und Positionen</title>
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="melder.css">
<script src="./melder.js"></script>
</head>
<body><div id="app" class="app"></div><div id="bericht"></div>

<!-- Erst den Stand bis an den Tryout-Tag bringen, dann die App laden — sie
     liest ihn beim Start. Die Werbung ist beschlossen, die Rollen-Anfragen
     unterwegs sind vertagt; geprüft wird ab dem Moment, in dem die Kandidaten
     auf dem Platz stehen. -->
<script type="module">
import { neuesSpiel, weiter, beantworteNachricht } from '../../engine/saison.js';
import { offeneAntworten, antwortenZu } from '../../engine/postfach.js';
import { tryoutTage } from '../../engine/kalender.js';
import { speichere } from '../../engine/save.js';

localStorage.clear();

const s = neuesSpiel('heg', 'tryout-smoke');
const tag = tryoutTage(s.jahr).herbst;
for (let i = 0; i < 20 && s.tag < tag; i++) {
  for (const n of offeneAntworten(s)) beantworteNachricht(s, n.id, antwortenZu(n.art).at(-1));
  weiter(s, tag + 1);
}
window.tryoutTag = s.tag === tag;
speichere(s);
</script>

<script type="module">
import '../../app.js';

const knopf = () => txt('.tageskarte button.haupt');
const leseKnopf = (name) => alle('.postlese button').find((b) => b.textContent === name);
const bildschirmKnopf = (name) => alle('.tryoutscreen button').find((b) => b.textContent === name);
const reiterKnopf = (name) => alle('.reiter button').find((b) => b.textContent === name);

try {
  pruefe('der Stand steht am Tryout-Tag', tryoutTag);

  // 1 — Die Nachricht hält den Kalender an und verweist auf den Bildschirm
  gleich('die Tageskarte führt zur Nachricht', knopf(), 'Zur Nachricht ›');
  q('.tageskarte button.haupt').click();
  enthaelt('das Tryout ist angekündigt', txt('.postlese h3'), 'auf dem Platz');
  pruefe('kein Reiter mehr — noch im Postfach', alle('.reiter').length, 1);
  const oeffnenKnopf = leseKnopf('Jetzt am Tryout teilnehmen');
  pruefe('der Knopf zum Bildschirm steht da', !!oeffnenKnopf, leseKnoepfe());
  pruefe('eine direkte Antwort steht nicht daneben — das ist Sache des Bildschirms',
    alle('.postlese .postknoepfe button').length === 0);

  // 2 — Der Bildschirm selbst: ohne die sechs Reiter, mit dem eigenen Kader
  oeffnenKnopf.click();
  gleich('keine Reiter mehr auf dem Tryout-Bildschirm', alle('.reiter').length, 0);
  enthaelt('der eigene Kader steht zum Vergleich da', txt('.tryout-kader'), 'Eigener Kader');
  gleich('achtzehn Positionszeilen', alle('.tryout-kader tbody tr').length, 18);
  const anzahl = alle('.tryoutteil .kandidat').length;
  pruefe('jeder Kandidat steht auf einer Karte', anzahl >= 5, anzahl);
  enthaelt('der Titel zählt sie', txt('.tryoutteil h2'), `${anzahl} Kandidaten`);
  gleich('je fünf Athletikwerte', alle('.tryoutteil .athletikwert').length, anzahl * 5);
  pruefe('als Punkte, nicht als Zahlen',
    alle('.tryoutteil .punkte').every((p) => /^[●○]{5}$/.test(p.textContent)));
  enthaelt('die Lebenslage steht ohne Vereinsjahre da', txt('.kandidaten'), 'Anfahrt');
  pruefe('und nicht „neu im Verein"', !txt('.kandidaten').includes('neu im Verein'));
  enthaelt('das Talent steht als Korridor da', txt('.kandidaten'), 'Talent (Einschätzung)');
  enthaelt('mit Sternen dahinter', txt('.kandidaten'), 'Sterne');
  enthaelt('der Stab schlägt Positionen vor', txt('.kandidaten'), 'Der Stab sieht ihn als');
  enthaelt('fünf Gespräche sind frei', txt('.tryoutteil'), 'Noch 5 Gespräche heute.');

  // 3 — Fünf Gespräche, dann ist Schluss
  for (let i = 0; i < 5; i++) {
    const frei = alle('.tryoutteil button').find((b) => b.textContent === 'Ansprechen' && !b.disabled);
    frei.click();
  }
  gleich('fünf sind angesprochen',
    alle('.tryoutteil .marke').filter((m) => m.textContent === 'Gesprochen').length, 5);
  pruefe('der Rest ist gesperrt',
    alle('.tryoutteil button').filter((b) => b.textContent === 'Ansprechen').every((b) => b.disabled));
  enthaelt('und das steht auch da', txt('.tryoutteil'), 'Mehr geht heute nicht');

  // 4 — Beenden kehrt ins Postfach zurück, drei Tage warten, die Zusagen
  bildschirmKnopf('Tryout beenden').click();
  gleich('zurück im Postfach', alle('.reiter').length, 1);
  enthaelt('danach steht, wann die Antworten kommen', txt('.postlese'), 'In drei Tagen');
  pruefe('kein Knopf zum Bildschirm mehr — die Station ist erledigt',
    !leseKnopf('Jetzt am Tryout teilnehmen'));
  // Der Tryout-Tag ist ein Wochenanfang: dahinter warten noch Rollen-Anfragen
  // derselben Woche. Sie werden vertagt.
  for (let i = 0; i < 10 && knopf() === 'Zur Nachricht ›'; i++) {
    q('.tageskarte button.haupt').click();
    const spaeter = leseKnopf('Später');
    if (!spaeter) break;
    spaeter.click();
  }
  gleich('die Uhr läuft wieder', knopf(), 'Bis dahin');
  q('.tageskarte button.haupt').click();
  gleich('sie hält bei den Zusagen', knopf(), 'Zur Nachricht ›');
  q('.tageskarte button.haupt').click();
  enthaelt('die Zusagen sind angekündigt', txt('.postlese h3'), 'vom Tryout');
  leseKnopf('Zu den Zusagen').click();

  // 5 — Die Positionsauswahl auf dem Bildschirm
  const auswahl = () => alle('.tryoutteil select');
  const neue = auswahl().length;
  pruefe('jeder Neue hat eine Positionsauswahl', neue > 0, neue);
  gleich('mit allen achtzehn Positionen', auswahl()[0].options.length, 18);
  const ziel = auswahl()[0].value === 'SS' ? 'FS' : 'SS';
  auswahl()[0].value = ziel;
  auswahl()[0].dispatchEvent(new Event('change'));
  gleich('die Wahl steht nach dem Neuzeichnen noch', auswahl()[0].value, ziel);
  bildschirmKnopf('Positionen übernehmen').click();

  // 6 — Zurück im Postfach, und im Personalreiter tragen die Neuen ihre Marke
  gleich('zurück im Postfach', alle('.reiter').length, 1);
  enthaelt('danach sind sie übernommen', txt('.postlese'), 'Übernommen');
  reiterKnopf('Personal').click();
  gleich('die Neuen stehen mit ihrer Marke im Kader',
    alle('.spielerzeile .marke').filter((m) => m.textContent === 'Rookie').length, neue);
  pruefe('und einer davon auf der gewählten Position',
    alle('.spielerzeile').some((z) => z.textContent.includes('Rookie')
      && [...z.children][2].textContent === ziel));
} catch (e) { merkeFehler(e); }
melde();

function leseKnoepfe() {
  return alle('.postlese button').map((b) => b.textContent).join(' | ');
}
</script></body></html>
