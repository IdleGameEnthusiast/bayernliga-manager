<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Eine ganze Saison, durchgeklickt bis zum Saisonwechsel</title>
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="melder.css">
<script src="./melder.js"></script>
</head>
<body><div id="app" class="app"></div><div id="bericht"></div>

<script type="module">
localStorage.clear();
</script>

<script type="module">
import '../../app.js';

/**
 * Ein Klick auf das, was gerade dran ist — genau die Handgriffe, die ein
 * Mensch täte: den Spielbericht wegklicken, eine Antwort geben, sonst die
 * Tageskarte drücken.
 * @returns {string} was getan wurde
 */
function einSchritt() {
  if (alle('.bericht-kopf').length > 0) {
    q('.fuss button.haupt').click();
    return 'bericht zu';
  }
  const knopf = q('.tageskarte button.haupt');
  if (!knopf) return 'nichts zu tun';
  if (knopf.textContent.trim() === 'Zur Nachricht ›') {
    knopf.click();
    const antwort = q('.postlese .postknoepfe button');
    if (!antwort) return 'antwort fehlt';
    antwort.click();
    return 'geantwortet';
  }
  knopf.click();
  return knopf.textContent.trim();
}

try {
  q('.start-team').click();
  q('.fuss button.haupt').click();
  gleich('die Karriere beginnt in Saison 2026', txt('.kopf-unter'), 'Saison 2026');

  // Eine ganze Saison, Handgriff für Handgriff, bis die Uhr von selbst
  // überrollt. Sie tut es am letzten Tag der Sommerpause, nicht auf Knopfdruck.
  const wege = [];
  let i = 0;
  for (; i < 200 && txt('.kopf-unter') !== 'Saison 2027'; i++) {
    const was = einSchritt();
    wege.push(was);
    if (was === 'nichts zu tun' || was === 'antwort fehlt') break;
  }
  pruefe('die Saison lässt sich durchklicken', txt('.kopf-unter') === 'Saison 2027',
    `${i} Handgriffe, zuletzt: ${wege.slice(-4).join(' / ')}`);
  pruefe('und zwar in überschaubar vielen Handgriffen', i < 60, `${i}`);
  // Zehn Gruppenspiele hat jeder; Halbfinale und Finale nur, wer hinkommt.
  const anpfiffe = wege.filter((w) => w === 'Anpfiff').length;
  pruefe('ein Anpfiff je eigenem Spiel', anpfiffe >= 10 && anpfiffe <= 12, `${anpfiffe}`);

  // Der Kalender steht auf Tag 1 des Folgejahres — Sa 17.10.2026.
  gleich('die neue Saison steht auf ihrem ersten Tag', txt('.kopf-datum'), 'Sa 17. Okt 2026');
  gleich('das Raster ist mitgegangen', txt('.kalkopf h2'), 'Oktober 2026');

  // Und im Postfach liegt, was der Wechsel mitbringt. Rücktritte sind nicht
  // darunter: nach der ersten Saison ist dafür niemand alt genug.
  gleich('nichts hält die Uhr auf', alle('.postzeichen.antwort').length, 0);
  const betreffe = alle('.postbetreff').map((e) => e.textContent);
  pruefe('der Vorstand meldet sich wieder mit den Zielen für 2027',
    betreffe.some((b) => b.includes('2027')), betreffe.join(' | '));
  // Nichts ist von selbst archiviert worden: was gelesen wurde, liegt noch da.
  pruefe('und der Meister steht noch im Posteingang',
    betreffe.some((b) => /meister/i.test(b)), betreffe.join(' | '));

  const karten = alle('.karte h2').map((h) => h.textContent);
  pruefe('die vergangene Saison steht im Rückblick',
    karten.includes('Vergangene Saisons'), karten.join(' | '));
  pruefe('mit Platz und Meister',
    alle('.karte p.klein').some((p) => p.textContent.startsWith('2026: Platz ')));

  // Zum Schluss: die sechs Reiter tragen alle noch etwas.
  const reiter = alle('.reiter button').map((b) => b.textContent);
  gleich('sechs Reiter', reiter.length, 6);
  for (let r = 0; r < reiter.length; r++) {
    alle('.reiter button')[r].click();
    pruefe(`Reiter „${reiter[r]}" zeigt etwas`, alle('.karte').length > 0);
  }
} catch (e) { merkeFehler(e); }
melde();
</script></body></html>
