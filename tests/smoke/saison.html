<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Eine ganze Saison, durchgeklickt bis zum Saisonwechsel</title>
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="melder.css">
<script src="./melder.js"></script>
</head>
<body><div id="app" class="app"></div><div id="bericht"></div>

<script type="module">
localStorage.clear();
</script>

<script type="module">
import '../../app.js';

/**
 * Ein Klick auf das, was gerade dran ist — genau die Handgriffe, die ein
 * Mensch täte: den Spielbericht wegklicken, ein Gespräch führen, eine Antwort
 * geben, sonst die Tageskarte drücken.
 *
 * Das Gespräch zählt als **ein** Handgriff, obwohl es drei Klicks sind: für
 * den Manager ist es eine Handlung — aufschlagen, Rolle sagen, zumachen.
 * @returns {string} was getan wurde
 */
function einSchritt() {
  if (alle('.frageschirm .gespraech').length > 0) {
    // Der Erste der Liste ist die größte Zusage. Dass dieser Tester jedem alles
    // verspricht, ist genau der Fall, der später wehtut — und damit der, den
    // eine Saison im Browser gesehen haben sollte.
    const wahl = q('.gespraech-kategorie');
    if (!wahl) return 'gespräch ohne wahl';
    wahl.click();
    const zu = q('.fragenknoepfe button');
    if (!zu) return 'gespräch ohne schluss';
    zu.click();
    return 'gesprochen';
  }
  if (alle('.bericht-kopf').length > 0) {
    q('.fuss button.haupt').click();
    return 'bericht zu';
  }
  const knopf = q('.tageskarte button.haupt');
  if (!knopf) return 'nichts zu tun';
  if (knopf.textContent.trim() === 'Zur Nachricht ›') {
    knopf.click();
    // Ein Tryout führt auf den eigenen Bildschirm; erst der Knopf dort
    // beendet die Station und kehrt ins Postfach zurück.
    const oeffnen = alle('.postlese button')
      .find((b) => b.textContent === 'Jetzt am Tryout teilnehmen' || b.textContent === 'Zu den Zusagen');
    if (oeffnen) {
      oeffnen.click();
      const fertig = alle('.tryoutscreen button')
        .find((b) => b.textContent === 'Tryout beenden' || b.textContent === 'Positionen übernehmen');
      if (!fertig) return 'tryout ohne abschluss';
      fertig.click();
      return 'tryout bearbeitet';
    }
    const antwort = q('.postlese .postknoepfe button');
    if (!antwort) return 'antwort fehlt';
    antwort.click();
    return 'geantwortet';
  }
  knopf.click();
  return knopf.textContent.trim();
}

try {
  q('.start-team').click();
  q('.fuss button.haupt').click();
  gleich('die Karriere beginnt in Saison 2026', txt('.kopf-unter'), 'Saison 2026');

  // Eine ganze Saison, Handgriff für Handgriff, bis die Uhr von selbst
  // überrollt. Sie tut es am letzten Tag der Sommerpause, nicht auf Knopfdruck.
  const wege = [];
  let i = 0;
  for (; i < 400 && txt('.kopf-unter') !== 'Saison 2027'; i++) {
    const was = einSchritt();
    wege.push(was);
    if (was === 'nichts zu tun' || was === 'antwort fehlt') break;
  }
  pruefe('die Saison lässt sich durchklicken', txt('.kopf-unter') === 'Saison 2027',
    `${i} Handgriffe, zuletzt: ${wege.slice(-4).join(' / ')}`);
  // Die Zahl ist seit der Rollen-Kampagne eine andere: die Offseason hat jetzt
  // Arbeit. An rund zwanzig Wochenanfängen fragen ein bis zwei Spieler nach
  // ihrer Rolle, und dieser Tester redet mit jedem von ihnen, statt zu
  // vertagen. Das ist der teuerste Weg durch eine Saison, den es gibt — die
  // Grenze sagt deshalb, dass er im Rahmen bleibt, nicht dass er kurz ist.
  pruefe('und zwar in überschaubar vielen Handgriffen', i < 160, `${i}`);
  const gespraeche = wege.filter((w) => w === 'gesprochen').length;
  pruefe('die Rollen-Kampagne ist durchgelaufen', gespraeche >= 20, `${gespraeche}`);
  // Zehn Gruppenspiele hat jeder; Halbfinale und Finale nur, wer hinkommt.
  const kickoffs = wege.filter((w) => w === 'Kickoff').length;
  pruefe('ein Kickoff je eigenem Spiel', kickoffs >= 10 && kickoffs <= 12, `${kickoffs}`);
  // Herbst- und Frühjahrs-Tryout liegen beide in dieser einen Saison, und die
  // Kandidaten-Station verlangt immer den Bildschirm — macht mindestens zwei.
  // Die Zusagen-Station tut das nur, wenn wenigstens einer zugesagt hat oder
  // das Sicherheitsnetz greift; sagt niemand zu, kommt eine bloße Absage ohne
  // Antwortpflicht, und dieser Lauf zählt sie nicht mit.
  const tryouts = wege.filter((w) => w === 'tryout bearbeitet').length;
  pruefe('beide Tryouts sind durchgelaufen', tryouts >= 2, `${tryouts}`);

  // Der Kalender steht auf Tag 1 des Folgejahres — Sa 17.10.2026.
  gleich('die neue Saison steht auf ihrem ersten Tag', txt('.kopf-datum'), 'Sa 17. Okt 2026');
  gleich('das Raster ist mitgegangen', txt('.kalkopf h2'), 'Oktober 2026');

  // Und im Postfach liegt, was der Wechsel mitbringt. Rücktritte sind nicht
  // darunter: nach der ersten Saison ist dafür niemand alt genug.
  gleich('nichts hält die Uhr auf', alle('.postzeichen.antwort').length, 0);
  const neueBetreffe = alle('.postbetreff').map((e) => e.textContent);
  pruefe('der Trainerstab eröffnet die Kampagne des neuen Jahres',
    neueBetreffe.some((b) => b.includes('woran sie ist')), neueBetreffe.join(' | '));
  const betreffe = alle('.postbetreff').map((e) => e.textContent);
  pruefe('der Vorstand meldet sich wieder mit den Zielen für 2027',
    betreffe.some((b) => b.includes('2027')), betreffe.join(' | '));
  // Nichts ist von selbst archiviert worden: was gelesen wurde, liegt noch da.
  pruefe('und der Meister steht noch im Posteingang',
    betreffe.some((b) => /meister/i.test(b)), betreffe.join(' | '));

  const karten = alle('.karte h2').map((h) => h.textContent);
  pruefe('die vergangene Saison steht im Rückblick',
    karten.includes('Vergangene Saisons'), karten.join(' | '));
  pruefe('mit Platz und Meister',
    alle('.karte p.klein').some((p) => p.textContent.startsWith('2026: Platz ')));

  // Zum Schluss: die sechs Reiter tragen alle noch etwas.
  const reiter = alle('.reiter button').map((b) => b.textContent);
  gleich('sechs Reiter', reiter.length, 6);
  for (let r = 0; r < reiter.length; r++) {
    alle('.reiter button')[r].click();
    pruefe(`Reiter „${reiter[r]}" zeigt etwas`, alle('.karte').length > 0);
  }

  // Und der Taktikreiter trägt den Stab: die Koordinatoren mit Namen, die
  // Vertrautheit an jeder Systemschaltfläche und die zwei Zeilen im Duell.
  // Nach einer Saison steht die Vertrautheit mit dem eigenen System über der
  // gezogenen — sonst hätte die Uhr den OC nicht mitgenommen.
  alle('.reiter button').find((b) => b.textContent === 'Taktik').click();
  gleich('drei Karten im Taktikreiter', alle('.karte').length, 3);
  gleich('zwei Koordinatoren', alle('.stabkarte .stabname').length, 2);
  gleich('jede Systemschaltfläche nennt die Vertrautheit',
    alle('.system').filter((b) => b.textContent.includes('Vertrautheit')).length, 8);
  enthaelt('der OC steht mit seiner Vertrautheit da', txt('.stabkarte'), 'Vertrautheit mit');
  const duell = alle('.duellreihe').map((z) => z.querySelector('.klein').textContent);
  pruefe('das Duell nennt den eigenen OC', duell.includes('Eigener OC'), duell.join(' | '));
  pruefe('und den DC des Gegners', duell.includes('DC des Gegners'), duell.join(' | '));
} catch (e) { merkeFehler(e); }
melde();
</script></body></html>
