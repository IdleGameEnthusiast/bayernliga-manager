<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>vis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="app.css"></head>
<body><div id="app" class="app"></div>
<script type="module">
  import { neuesSpiel, weiter, beantworteNachricht } from './engine/saison.js';
  import { tagVonSpieltag } from './engine/kalender.js';
  import { speichere } from './engine/save.js';
  const q = new URLSearchParams(location.search);
  const s = neuesSpiel('heg', 'vis-seed');
  // Der Vorstand hält den Kalender an, bis er eine Antwort hat — auch hier.
  beantworteNachricht(s, s.post[s.post.length - 1].id, 'ja');
  // Ohne ?ende steht die Saison mitten in der Gruppenrunde, mit ?ende hinter
  // dem Finale — die einzige Stelle, an der das Bracket vollständig zu sehen ist.
  // Jeder eigene Spieltag hält an, also wird so oft weitergespielt, bis der
  // Kalender am Ziel steht; die Schranke fängt einen Stopp ab, der nicht weicht.
  const ziel = tagVonSpieltag(q.has('ende') ? 12 : 8);
  for (let i = 0; i < 40 && s.tag < ziel; i++) weiter(s, ziel);
  if (q.has('ende')) weiter(s);
  speichere(s);
  await import('./app.js');
  // Über den Namen und nicht über die Nummer: die Reihenfolge der Reiter hat
  // sich schon einmal geändert, und dann zeigte diese Fixture stillschweigend
  // die falsche Ansicht.
  const v = q.get('v');
  const reiter = (name) => [...document.querySelectorAll('.reiter button')]
    .find((b) => b.textContent === name);
  const ANSICHT = {
    tabelle: 'Tabelle', kader: 'Roster', personal: 'Personal',
    taktik: 'Taktik', spielplan: 'Spielplan',
  };
  if (ANSICHT[v]) reiter(ANSICHT[v]).click();
  if (v === 'bericht') {
    reiter('Spielplan').click();
    document.querySelector('.paarung[role=button]').click();
  }
</script></body></html>
